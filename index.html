<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shakshi Sharma</title>
    <meta name="description" content="Hello, meet Shakshi." />
    <meta name="theme-color" content="#f3f3e9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('no-motion');
        if (/[?&]nointro\b/.test(location.search)) d.classList.add('no-intro');
      })();
    </script>
  </head>
  <body>
    <!-- preloader: big words and photo flashes, then it collapses to a line -->
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader__img" id="loader-img"><img src="/me.png" alt="" /></div>
      <p class="loader__word" id="loader-word"></p>
    </div>

    <div class="page" id="page">
    <!-- ribbon -->
    <div class="ribbon" id="ribbon">
      <div class="ribbon__track" id="ribbon-track" aria-hidden="true"></div>
      <p class="visually-hidden">New website, who dis?</p>
      <button class="ribbon__close" id="ribbon-close" type="button" aria-label="Close the banner">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" /></svg>
      </button>
    </div>

    <header class="nav">
      <a class="nav__logo" href="/" aria-label="Shakshi, home" id="logo"></a>
      <button class="nav__menu" id="menu-open" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="hero" id="hero" aria-labelledby="hero-title">
        <h1 class="visually-hidden" id="hero-title">Hello, meet Shakshi</h1>
        <div class="hero__stage">
          <div class="hero__photo" id="photo">
            <svg class="ink ink--back" id="ink-back" viewBox="0 0 1360 1080" aria-hidden="true"></svg>
            <div class="hero__img"><img src="/me.png" alt="Shakshi, smiling, in a white shirt with her long dark hair down" /></div>
            <svg class="ink ink--front" id="ink-front" viewBox="0 0 1360 1080" aria-hidden="true"></svg>
          </div>

          <p class="big big--hello" aria-hidden="true">HELLO</p>
          <p class="mono mono--name" aria-hidden="true"><span class="type" data-text="{{ first name }}"></span><span class="caret"></span></p>
          <p class="big big--meet" aria-hidden="true">MEET</p>
          <p class="mono mono--tag">
            <span class="type" data-text="A DEVELOPER/DESIGNER/DOODLER WITH BIG PLANS."></span><span class="caret"></span>
          </p>
          <p class="big big--name" aria-hidden="true">SHAKSHI</p>
        </div>
      </section>
    </main>
    </div>

    <!-- menu -->
    <div class="menu" id="menu" hidden>
      <button class="menu__close" id="menu-close" type="button" aria-label="Close menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" /></svg>
      </button>
      <ul class="menu__list">
        <li><span>WORK</span> <small>coming soon</small></li>
        <li><span>ABOUT</span> <small>coming soon</small></li>
        <li><span>SAY HI</span> <small>coming soon</small></li>
      </ul>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
